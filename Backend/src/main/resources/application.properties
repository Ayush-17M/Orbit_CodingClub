spring.application.name=Backend

server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url= jdbc:mysql://localhost:3306/orbit
spring.datasource.username= root
spring.datasource.password=Password@12345

spring.jpa.hibernate.ddl-auto= update
spring.jpa.open-in-view= false

orbit.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
orbit.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
orbit.admin.username = ${ADMIN_USERNAME:admin}
orbit.admin.password = ${ADMIN_PASSWORD:Admin123}

orbit.corss-origins= ${CORS_ORIGINS:http://localhost:5173}
orbit.upload-dir=${UPLOAD_DIR:./uploads}